services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${BETAI_DB_NAME:-bet_ai}
      POSTGRES_USER: ${BETAI_DB_USERNAME:-bet_ai}
      POSTGRES_PASSWORD: ${BETAI_DB_PASSWORD:-bet_ai}
    ports:
      - "${BETAI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - bet-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BETAI_DB_USERNAME:-bet_ai} -d ${BETAI_DB_NAME:-bet_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      BETAI_DB_URL: "jdbc:postgresql://postgres:5432/${BETAI_DB_NAME:-bet_ai}"
      BETAI_DB_USERNAME: "${BETAI_DB_USERNAME:-bet_ai}"
      BETAI_DB_PASSWORD: "${BETAI_DB_PASSWORD:-bet_ai}"
      BETAI_ADMIN_API_KEY: "${BETAI_ADMIN_API_KEY:-local-dev-admin-key}"
      BETAI_FORM_MATCH_STATUSES: "${BETAI_FORM_MATCH_STATUSES:-SCHEDULED}"
      BETAI_MODEL_VERSION: "${BETAI_MODEL_VERSION:-phase27-dixon-coles-v2}"
      BETAI_DEFAULT_SEASON_COUNT: "${BETAI_DEFAULT_SEASON_COUNT:-3}"
      BETAI_MAXIMUM_SEASON_COUNT: "${BETAI_MAXIMUM_SEASON_COUNT:-10}"
      BETAI_INSUFFICIENT_SEASON_POLICY: "${BETAI_INSUFFICIENT_SEASON_POLICY:-USE_MAX_AVAILABLE}"
      BETAI_MINIMUM_COMPLETED_MATCHES_PER_USABLE_SEASON: "${BETAI_MINIMUM_COMPLETED_MATCHES_PER_USABLE_SEASON:-10}"
      BETAI_SHARPAPI_ENABLED: "${BETAI_SHARPAPI_ENABLED:-true}"
      BETAI_SHARPAPI_KEY: "${BETAI_SHARPAPI_KEY:-}"
      BETAI_SHARPAPI_BASE_URL: "${BETAI_SHARPAPI_BASE_URL:-https://api.sharpapi.io/api/v1}"
      BETAI_API_FOOTBALL_ENABLED: "${BETAI_API_FOOTBALL_ENABLED:-true}"
      BETAI_API_FOOTBALL_KEY: "${BETAI_API_FOOTBALL_KEY:-}"
      BETAI_API_FOOTBALL_BASE_URL: "${BETAI_API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}"
      BETAI_API_FOOTBALL_TIMEZONE: "${BETAI_API_FOOTBALL_TIMEZONE:-UTC}"
      BETAI_THESPORTSDB_API_KEY: "${BETAI_THESPORTSDB_API_KEY:-${THESPORTSDB_API_KEY:-}}"
      BETAI_THESPORTSDB_ENABLED: "${BETAI_THESPORTSDB_ENABLED:-true}"
      BETAI_THESPORTSDB_BASE_URL: "${BETAI_THESPORTSDB_BASE_URL:-https://www.thesportsdb.com/api/v2/json}"
      BETAI_THESPORTSDB_REQUESTS_PER_MINUTE: "${BETAI_THESPORTSDB_REQUESTS_PER_MINUTE:-80}"
      BETAI_THESPORTSDB_CONNECTION_TIMEOUT: "${BETAI_THESPORTSDB_CONNECTION_TIMEOUT:-10s}"
      BETAI_THESPORTSDB_READ_TIMEOUT: "${BETAI_THESPORTSDB_READ_TIMEOUT:-30s}"
      BETAI_THESPORTSDB_LIVE_SCORES_ENABLED: "${BETAI_THESPORTSDB_LIVE_SCORES_ENABLED:-true}"
      BETAI_THESPORTSDB_LIVE_SCORES_REFRESH_FIXED_DELAY_MS: "${BETAI_THESPORTSDB_LIVE_SCORES_REFRESH_FIXED_DELAY_MS:-180000}"
      BETAI_THESPORTSDB_LIVE_SCORES_INITIAL_DELAY_MS: "${BETAI_THESPORTSDB_LIVE_SCORES_INITIAL_DELAY_MS:-60000}"
      BETAI_THESPORTSDB_COVERAGE_FULL_THRESHOLD: "${BETAI_THESPORTSDB_COVERAGE_FULL_THRESHOLD:-0.80}"
      BETAI_THESPORTSDB_COVERAGE_PARTIAL_THRESHOLD: "${BETAI_THESPORTSDB_COVERAGE_PARTIAL_THRESHOLD:-0.30}"
      BETAI_AUTOMATION_ENABLED: "${BETAI_AUTOMATION_ENABLED:-false}"
      BETAI_AUTOMATION_DAILY_CRON: "${BETAI_AUTOMATION_DAILY_CRON:-0 15 6 * * *}"
      BETAI_AUTOMATION_ZONE: "${BETAI_AUTOMATION_ZONE:-UTC}"
      BETAI_AUTOMATION_LEAGUE_CODES: "${BETAI_AUTOMATION_LEAGUE_CODES:-}"
      BETAI_AUTOMATION_PREDICTION_MATCH_STATUSES: "${BETAI_AUTOMATION_PREDICTION_MATCH_STATUSES:-SCHEDULED}"
      BETAI_AUTOMATION_PREDICTION_WINDOW_DAYS: "${BETAI_AUTOMATION_PREDICTION_WINDOW_DAYS:-4}"
      BETAI_AUTOMATION_SETTLEMENT_LOOKBACK_DAYS: "${BETAI_AUTOMATION_SETTLEMENT_LOOKBACK_DAYS:-3}"
      BETAI_AUTOMATION_HISTORICAL_PREDICTION_LOOKBACK_DAYS: "${BETAI_AUTOMATION_HISTORICAL_PREDICTION_LOOKBACK_DAYS:-365}"
      BETAI_AUTOMATION_BACKTEST_LOOKBACK_DAYS: "${BETAI_AUTOMATION_BACKTEST_LOOKBACK_DAYS:-365}"
      BETAI_AUTOMATION_BACKTEST_MINIMUM_SAMPLE_SIZE: "${BETAI_AUTOMATION_BACKTEST_MINIMUM_SAMPLE_SIZE:-30}"
      BETAI_AUTOMATION_MAX_STEP_ATTEMPTS: "${BETAI_AUTOMATION_MAX_STEP_ATTEMPTS:-3}"
      BETAI_AUTOMATION_RETRY_BACKOFF_MS: "${BETAI_AUTOMATION_RETRY_BACKOFF_MS:-1500}"
      BETAI_AUTOMATION_STEP_TIMEOUT_MS: "${BETAI_AUTOMATION_STEP_TIMEOUT_MS:-7200000}"
      BETAI_AUTOMATION_RUN_REFRESH: "${BETAI_AUTOMATION_RUN_REFRESH:-true}"
      BETAI_AUTOMATION_RUN_EXTRACTION: "${BETAI_AUTOMATION_RUN_EXTRACTION:-true}"
      BETAI_AUTOMATION_RUN_ODDS_EXTRACTION: "${BETAI_AUTOMATION_RUN_ODDS_EXTRACTION:-true}"
      BETAI_AUTOMATION_RUN_FIXTURE_DISCOVERY: "${BETAI_AUTOMATION_RUN_FIXTURE_DISCOVERY:-true}"
      BETAI_AUTOMATION_FIXTURE_DISCOVERY_AUTO_REGISTER_FOOTBALL_DATA_SOURCES: "${BETAI_AUTOMATION_FIXTURE_DISCOVERY_AUTO_REGISTER_FOOTBALL_DATA_SOURCES:-true}"
      BETAI_AUTOMATION_FIXTURE_DISCOVERY_GENERATE_PENDING_SLATE: "${BETAI_AUTOMATION_FIXTURE_DISCOVERY_GENERATE_PENDING_SLATE:-true}"
      BETAI_AUTOMATION_FIXTURE_DISCOVERY_TARGET_SEASON_LABEL: "${BETAI_AUTOMATION_FIXTURE_DISCOVERY_TARGET_SEASON_LABEL:-}"
      BETAI_AUTOMATION_RUN_FEATURES: "${BETAI_AUTOMATION_RUN_FEATURES:-true}"
      BETAI_AUTOMATION_RUN_HISTORICAL_PREDICTIONS: "${BETAI_AUTOMATION_RUN_HISTORICAL_PREDICTIONS:-false}"
      BETAI_AUTOMATION_RUN_PREDICTIONS: "${BETAI_AUTOMATION_RUN_PREDICTIONS:-true}"
      BETAI_AUTOMATION_RUN_SETTLEMENT: "${BETAI_AUTOMATION_RUN_SETTLEMENT:-true}"
      BETAI_AUTOMATION_RUN_MODEL_QUALITY: "${BETAI_AUTOMATION_RUN_MODEL_QUALITY:-true}"
      BETAI_AUTOMATION_RUN_BACKTEST: "${BETAI_AUTOMATION_RUN_BACKTEST:-false}"
      BETAI_AUTOMATION_REQUESTED_SEASON_COUNT: "${BETAI_AUTOMATION_REQUESTED_SEASON_COUNT:-}"
      BETAI_AUTOMATION_SEASON_SELECTION_MODE: "${BETAI_AUTOMATION_SEASON_SELECTION_MODE:-CURRENT_AND_RECENT_COMPLETE}"
      BETAI_AUTOMATION_CUSTOM_SEASON_IDS: "${BETAI_AUTOMATION_CUSTOM_SEASON_IDS:-}"
      BETAI_LOG_LEVEL: "${BETAI_LOG_LEVEL:-INFO}"
    ports:
      - "${BETAI_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  bet-ai-postgres-data:
